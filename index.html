<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matin Kim</title>
  
  <!-- Font imports: Inter (clean sans-serif for navigation) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* CSS Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111111;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* Header Container */
    .site-header {
      width: 100%;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 40px;
      background-color: #ffffff;
      position: relative;
      z-index: 10;
    }

    /* Left Navigation */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-left a {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111111;
      transition: opacity 0.2s ease;
    }

    .nav-left a:hover {
      opacity: 0.6;
    }

    /* Center Brand Logo */
    .nav-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-center .brand-logo {
      height: 22px; /* Adjust based on your PNG proportions */
      width: auto;
      object-fit: contain;
    }

    /* Right Navigation & Utility Icons */
    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
    }

    .nav-right-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #111111;
      cursor: pointer;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .icon-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .lang-text {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Hero Banner Section */
    .hero-banner {
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .hero-banner img {
      width: 100%;
      height: calc(100vh - 64px); /* Full height minus header */
      object-fit: cover;
      object-position: center;
    }

    /* Pagination / Indicator Bar */
    .carousel-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 0;
      background-color: #ffffff;
    }

    .indicator-track {
      width: 80px;
      height: 2px;
      background-color: #e0e0e0;
      position: relative;
    }

    .indicator-progress {
      width: 50%;
      height: 100%;
      background-color: #000000;
      position: absolute;
      left: 0;
      top: 0;
    }

    /* Responsive scaling for smaller screens */
    @media (max-width: 1024px) {
      .site-header {
        padding: 0 20px;
      }
      .nav-left {
        gap: 16px;
      }
      .nav-left a {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="site-header">
    
    <!-- Left Menu Links -->
    <nav class="nav-left">
      <a href="#">PROJECT</a>
      <a href="#">ABOUT</a>
      <!-- <a href="#">NEWS</a> -->
    </nav>

    <!-- Center Brand Logo -->
    <div class="nav-center">
      <a href="#">
        <!-- Replace logo.png with your Matin Kim PNG file -->
        <img src="assets/jaey-kim-main-logo.png" alt="Matin Kim" class="brand-logo">
      </a>
    </div>

    <!-- Right Utility Icons -->
    <div class="nav-right">
      <!-- Instagram -->
      <a href="#" class="icon-btn" aria-label="Instagram">
        <img src="instagram.png" alt="Instagram">
      </a>

      <!-- Language Selector -->
      <div class="nav-right-item">
        <span class="icon-btn">
          <img src="globe.png" alt="Language">
        </span>
        <span class="lang-text">English</span>
      </div>

      <!-- User Account -->
      <a href="#" class="icon-btn" aria-label="Account">
        <img src="user.png" alt="Account">
      </a>

      <!-- Search -->
      <a href="#" class="icon-btn" aria-label="Search">
        <img src="search.png" alt="Search">
      </a>

      <!-- Shopping Cart -->
      <a href="#" class="icon-btn" aria-label="Cart">
        <img src="cart.png" alt="Cart">
      </a>
    </div>

  </header>

  <!-- Main Hero Image -->
  <main class="hero-banner">
    <!-- Replace main-banner.jpg with your hero background image -->
    <img src="main-banner.jpg" alt="Matin Kim Banner">
  </main>

  <!-- Slider Indicator -->
  <div class="carousel-indicator">
    <div class="indicator-track">
      <div class="indicator-progress"></div>
    </div>
  </div>

</body>
</html>
